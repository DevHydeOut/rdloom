# Dependency updates arrive as pull requests into `develop`, never straight into `main`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates of the tools the build and tests use come as one pull request.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Version 9 changed the table API that DataGrid is built on; moving to it is a planned change, not a routine bump.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
