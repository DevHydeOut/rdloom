name: Release

# Publishes rdloom and @rdloom/mcp to npm when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Run it from the Actions tab with "dry run" first to see exactly what would
# ship without publishing anything. npm publishes are permanent.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and check only; publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Lets npm record provenance: a signed link from the package back to the
      # commit and workflow that built it, shown on the npm page.
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Generate (registry, types, MCP context)
        run: npm run gen

      - name: Generated files are committed
        run: npm run check:generated

      - name: Tests
        run: npm run test:unit

      - name: The tag matches the package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for dir in cli mcp; do
            version=$(node -p "require('./packages/$dir/package.json').version")
            [ "$version" = "$tag" ] || { echo "::error::packages/$dir is $version but the tag says $tag"; exit 1; }
          done

      # A dry run would otherwise never touch the token, so a bad or
      # wrongly-scoped one would only surface during the real publish.
      - name: The npm token works and can publish these names
        run: |
          echo "authenticated as: $(npm whoami)"
          for pkg in rdloom @rdloom/mcp; do
            owner=$(npm owner ls "$pkg" 2>/dev/null || true)
            if [ -z "$owner" ]; then
              echo "$pkg: unpublished, the name is still free"
            else
              echo "$pkg current owners:"; echo "$owner"
            fi
          done
          # @rdloom/mcp publishes into the org, so this account must be a member
          # of it. rdloom is unscoped: it lands under this account and is
          # transferred to the org afterwards.
          echo "members of the rdloom org:"
          npm org ls rdloom
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack both packages
        # --pack-destination writes into the directory but will not create it.
        run: |
          mkdir -p ./.packs
          npm pack -w rdloom -w @rdloom/mcp --pack-destination ./.packs

      - name: What would be published
        run: |
          for tgz in ./.packs/*.tgz; do
            echo "::group::$tgz"
            tar -tzf "$tgz" | sort
            echo "::endgroup::"
          done

      - name: Install from the tarballs and smoke test
        run: bash scripts/sample-app.sh

      # Staged, not published outright: CI submits the version and a maintainer
      # promotes it with their own 2FA. A leaked CI token therefore cannot put
      # anything on the registry. npm is removing direct publishing through
      # 2FA-bypass tokens in January 2027, so this is also where it is heading.
      - name: Stage both packages for release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry-run != true
        run: npm stage publish -w rdloom -w @rdloom/mcp --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: What to do next
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry-run != true
        run: |
          echo "::notice::Staged ${GITHUB_REF_NAME}. Promote it at https://www.npmjs.com/settings/$(npm whoami)/staged-packages (needs your 2FA)."
          echo "After the first promotion, give the org the unscoped package once:"
          echo "  npm owner add rdloom rdloom --otp=<code>"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
