<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#1c1a17"/>
  <!-- Three warp threads (cream) and two weft threads (ember): each weft passes over, then under, the warp. -->
  <g stroke-width="2.4" stroke-linecap="butt" fill="none">
    <path d="M10 6v20M16 6v20M22 6v20" stroke="#f3f0ea"/>
    <path d="M5 12h26M5 20h26" stroke="#fb923c"/>
    <!-- Where a warp thread goes over a weft, redraw it on top. -->
    <path d="M16 9v6M10 17v6M22 17v6" stroke="#f3f0ea"/>
  </g>
</svg>
